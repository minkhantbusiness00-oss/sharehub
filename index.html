<!DOCTYPE html>
<html lang="my" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShareHub — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'Padauk', 'sans-serif'] } } }
    }
  </script>
  <style>
    :root { --bg: #f7f7f7; --card: #ffffff; --text: #0a0a0a; --border: #e4e4e4; }
    html.dark { --bg: #0a0a0a; --card: #141414; --text: #f5f5f5; --border: #262626; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Padauk', sans-serif; -webkit-tap-highlight-color: transparent; }
    .clean-card { background: var(--card); border: 1px solid var(--border); transition: border-color 0.15s ease; }
    .clean-card:hover { border-color: var(--text); }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-white/95 dark:bg-[#0a0a0a]/95 border-b border-neutral-200 dark:border-neutral-800">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-2.5 flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-bold text-xs">SH</div>
          <h1 class="font-bold text-sm sm:text-base">ShareHub</h1>
          <button onclick="openKeyModal()" id="dbBadge" class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full border border-neutral-300 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-900 flex items-center gap-1.5">
            <span id="dbDot" class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
            <span id="dbText">Connecting...</span>
          </button>
        </div>

        <!-- Desktop Tabs -->
        <nav class="hidden md:flex items-center gap-1 p-1 rounded-xl bg-neutral-100 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 ml-3">
          <button onclick="switchTab('text')" id="dt-text" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold">TextShare <span id="dc-text" class="opacity-70">0</span></button>
          <button onclick="switchTab('image')" id="dt-image" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold">ImageShare <span id="dc-image" class="opacity-70">0</span></button>
          <button onclick="switchTab('link')" id="dt-link" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold">LinkShare <span id="dc-link" class="opacity-70">0</span></button>
        </nav>

        <!-- Mobile Top Buttons -->
        <div class="flex md:hidden items-center gap-1.5">
          <button onclick="syncFromCloud(false)" class="px-2.5 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-800 text-xs font-bold" title="Refresh">↻</button>
          <button onclick="toggleTheme()" class="px-2.5 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-800 text-xs">◐</button>
          <button onclick="openModal()" class="px-3 py-1.5 rounded-xl bg-black text-white dark:bg-white dark:text-black text-xs font-semibold">+ New</button>
        </div>
      </div>

      <!-- Search + Desktop Actions -->
      <div class="flex items-center gap-2 flex-1 md:max-w-md justify-end">
        <input id="searchInput" type="text" oninput="render()" placeholder="Search..." class="w-full px-3.5 py-1.5 text-xs sm:text-sm rounded-xl bg-neutral-100 dark:bg-neutral-900 border border-transparent focus:border-black dark:focus:border-white focus:outline-none" />
        <div class="hidden md:flex items-center gap-1.5 shrink-0">
          <button onclick="syncFromCloud(false)" class="px-2.5 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-800 text-xs font-bold hover:border-black dark:hover:border-white" title="Sync Now">↻</button>
          <button onclick="toggleTheme()" class="px-2.5 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-800 text-xs hover:border-black dark:hover:border-white">◐</button>
          <button onclick="openModal()" class="px-3.5 py-1.5 rounded-xl bg-black text-white dark:bg-white dark:text-black text-xs font-semibold">+ New</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ERROR BANNER (ONLY SHOWS IF SUPABASE BLOCKS REQUEST) -->
  <div id="errBanner" class="hidden max-w-7xl w-full mx-auto px-3 sm:px-5 pt-2">
    <div class="p-2.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-600 dark:text-red-400 text-xs flex items-center justify-between">
      <span id="errText">Database Notice</span>
      <button onclick="openKeyModal()" class="underline font-semibold ml-2">Check Key</button>
    </div>
  </div>

  <!-- MAIN GRID -->
  <main class="max-w-7xl w-full mx-auto px-3 sm:px-5 py-3.5 flex-1">
    <div id="gridContainer" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-3"></div>
    <div id="emptyBox" class="hidden py-20 text-center text-xs text-neutral-400">
      မှတ်သားထားသော အချက်အလက် မရှိသေးပါ
    </div>
  </main>

  <!-- MOBILE BOTTOM TABS -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-[#0a0a0a]/95 backdrop-blur-md border-t border-neutral-200 dark:border-neutral-800 px-3 py-1.5">
    <div class="grid grid-cols-3 gap-1.5 max-w-md mx-auto">
      <button onclick="switchTab('text')" id="mb-text" class="py-2 rounded-xl text-xs font-semibold">Text <span id="mc-text" class="opacity-70">0</span></button>
      <button onclick="switchTab('image')" id="mb-image" class="py-2 rounded-xl text-xs font-semibold">Image <span id="mc-image" class="opacity-70">0</span></button>
      <button onclick="switchTab('link')" id="mb-link" class="py-2 rounded-xl text-xs font-semibold">Link <span id="mc-link" class="opacity-70">0</span></button>
    </div>
  </nav>

  <!-- ADD / EDIT MODAL -->
  <div id="itemModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#141414] border border-neutral-200 dark:border-neutral-800 w-full max-w-md rounded-2xl p-5 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-neutral-200 dark:border-neutral-800">
        <h2 id="modalTitle" class="font-bold text-sm">အသစ်ထည့်မည်</h2>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-black dark:hover:text-white">✕</button>
      </div>
      <form onsubmit="saveItem(event)" class="space-y-3 mt-3">
        <input type="hidden" id="editId" />
        <div class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-neutral-100 dark:bg-neutral-900 text-xs font-semibold">
          <button type="button" onclick="setFormType('text')" id="ft-text" class="py-1.5 rounded-lg">Text</button>
          <button type="button" onclick="setFormType('image')" id="ft-image" class="py-1.5 rounded-lg">Image</button>
          <button type="button" onclick="setFormType('link')" id="ft-link" class="py-1.5 rounded-lg">Link</button>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">ခေါင်းစဉ် (Title)</label>
          <input id="inpTitle" type="text" required placeholder="ဥပမာ - Gold Logo Prompt" class="w-full px-3 py-2 text-sm rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700" />
        </div>
        <div id="fg-text">
          <label class="block text-xs font-semibold mb-1">စာသား (Text / Prompt)</label>
          <textarea id="inpText" rows="4" placeholder="သိမ်းထားချင်သော စာသား..." class="w-full px-3 py-2 text-sm rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700"></textarea>
        </div>
        <div id="fg-image" class="hidden space-y-2">
          <label class="flex flex-col items-center justify-center w-full h-20 border border-dashed border-neutral-300 dark:border-neutral-700 rounded-xl cursor-pointer text-xs text-neutral-500">
            <span>စက်ထဲမှ ပုံရွေးရန် နှိပ်ပါ</span>
            <input type="file" accept="image/*" onchange="uploadImg(event)" class="hidden" />
          </label>
          <input id="inpImgUrl" type="url" placeholder="သို့မဟုတ် Image URL (https://...)" class="w-full px-3 py-2 text-sm rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700" />
        </div>
        <div id="fg-link" class="hidden">
          <label class="block text-xs font-semibold mb-1">Website Link (URL)</label>
          <input id="inpLink" type="url" placeholder="https://..." class="w-full px-3 py-2 text-sm rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-neutral-300 dark:border-neutral-700">Cancel</button>
          <button type="submit" id="saveBtn" class="px-5 py-2 rounded-xl text-xs font-semibold bg-black text-white dark:bg-white dark:text-black">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- READER MODAL -->
  <div id="readerModal" onclick="closeReader()" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-white dark:bg-[#141414] border border-neutral-200 dark:border-neutral-800 w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-neutral-200 dark:border-neutral-800 pb-2">
        <h3 id="rTitle" class="font-bold text-sm"></h3>
        <button onclick="closeReader()">✕</button>
      </div>
      <div id="rBody" class="p-3 rounded-xl bg-neutral-50 dark:bg-neutral-900 text-xs sm:text-sm whitespace-pre-wrap max-h-[60vh] overflow-y-auto"></div>
      <div class="flex justify-between pt-1">
        <div class="flex gap-1.5">
          <button id="rEdit" class="px-3 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-700 text-xs font-semibold">Edit</button>
          <button id="rDel" class="px-3 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-700 text-xs font-semibold text-red-500">Delete</button>
        </div>
        <button id="rCopy" class="px-4 py-1.5 rounded-xl bg-black text-white dark:bg-white dark:text-black text-xs font-semibold">Copy</button>
      </div>
    </div>
  </div>

  <!-- KEY CONFIG MODAL -->
  <div id="keyModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#141414] border border-neutral-200 dark:border-neutral-800 w-full max-w-md rounded-2xl p-5 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b border-neutral-200 dark:border-neutral-800 pb-2">
        <h3 class="font-bold text-sm">Supabase Connection</h3>
        <button onclick="document.getElementById('keyModal').classList.add('hidden')">✕</button>
      </div>
      <div>
        <label class="font-semibold block mb-1">Project URL</label>
        <input id="cfgUrl" type="url" class="w-full px-3 py-2 rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700" />
      </div>
      <div>
        <label class="font-semibold block mb-1">Publishable / Anon Key</label>
        <input id="cfgKey" type="text" class="w-full px-3 py-2 rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700 font-mono" />
      </div>
      <div class="flex justify-between pt-2">
        <button onclick="resetDefaultKey()" class="px-3 py-2 rounded-xl border border-neutral-300 dark:border-neutral-700 font-semibold">Reset Default</button>
        <button onclick="saveCustomKey()" class="px-4 py-2 rounded-xl bg-black text-white dark:bg-white dark:text-black font-semibold">Save & Connect</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all">
    <div id="toastMsg" class="bg-black text-white dark:bg-white dark:text-black px-4 py-2 rounded-xl shadow-lg text-xs font-semibold">Copied!</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tmtqrkwpicvqdraqjutf.supabase.co';
    const KEY_LIST = [
      'sb_publishable_gq001WarHMvAJEmt4gX-kg_kL40tFoh',
      'sb_publishable_gq001WarHMvAJEmt4gX-kg_kL4OtFoh',
      'sb_publishable_gqOO1WarHMvAJEmt4gX-kg_kL4OtFoh',
      'sb_publishable_gqOO1WarHMvAJEmt4gX-kg_kL40tFoh'
    ];

    const FALLBACK_ITEMS = [
      { id: 't1', type: 'text', title: 'Sticker Design (Lemon)', content: 'ဒီ Logo ကို အသုံးပြုပြီးတော့ ပန်းကန်ဆေးဆပ်ပြာဘူးအတွက် Sticker Design လုပ်ပေးပါ။ lemon. Yellow theme.', created_at: 1730131920000 },
      { id: 't2', type: 'text', title: 'Flat Vector Lettering Only', content: 'Give me Lettering Design Only. Black color. White bg. flat vector. No 3d, No stroke. Don\'t change Letter style.', created_at: 1730045640000 },
      { id: 't3', type: 'text', title: 'Myanmar Girl Minimalist', content: 'Change Myanmar Girl Shape. Clean and Minimalist. Simple.', created_at: 1729777920000 },
      { id: 't4', type: 'text', title: 'Bright Gradient Gold Color', content: 'Make Bright gradient gold color. Remove Background. High qulaity. Don\'t change Anything.', created_at: 1729619760000 },
      { id: 't5', type: 'text', title: 'Remove BG & Make PNG', content: 'remove background. make PNG file. Don\'t change anyting.', created_at: 1729619340000 },
      { id: 't6', type: 'text', title: 'Good Resolution & Remove BG', content: 'please make good resolution and remove background. Don\'t change anyting.', created_at: 1729618920000 },
      { id: 't7', type: 'text', title: 'Cinematic Logo Mockup', content: 'Make Cinematic Logo Color Mockup Show.', created_at: 1729581480000 }
    ];

    let items = [...FALLBACK_ITEMS];
    let activeTab = 'text';
    let formType = 'text';
    let uploadedImg = '';
    let sbClient = null;

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.Telegram && window.Telegram.WebApp) {
        try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}
      }
      if (localStorage.getItem('sh_theme') === 'dark') document.documentElement.classList.add('dark');

      // 1. Render immediately so screen is NEVER blank
      const cached = localStorage.getItem('sh_cache_items');
      if (cached) {
        try { const parsed = JSON.parse(cached); if (parsed.length) items = parsed; } catch (e) {}
      }
      switchTab('text');

      // 2. Connect to Supabase via Official SDK
      await initSupabase();

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') syncFromCloud(true);
      });
    });

    async function initSupabase() {
      const savedUrl = localStorage.getItem('sh_custom_url') || SUPABASE_URL;
      const savedKey = localStorage.getItem('sh_custom_key');
      const candidates = savedKey ? [savedKey, ...KEY_LIST] : KEY_LIST;

      for (const key of candidates) {
        try {
          const client = window.supabase.createClient(savedUrl, key);
          const { data, error } = await client
            .from('share_hub_items')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && Array.isArray(data)) {
            sbClient = client;
            localStorage.setItem('sh_custom_key', key);
            items = data;
            localStorage.setItem('sh_cache_items', JSON.stringify(items));
            setBadge(true, `Cloud (${items.length})`);
            document.getElementById('errBanner').classList.add('hidden');
            render();
            return;
          }
        } catch (e) {}
      }

      setBadge(false, 'Key Error');
      const banner = document.getElementById('errBanner');
      document.getElementById('errText').textContent = 'Supabase Key မကိုက်ညီပါ — Check Key ကိုနှိပ်ပြီး Supabase မှ Publishable Key သို့မဟုတ် Legacy anon key ကို Paste ချပေးပါ။';
      banner.classList.remove('hidden');
    }

    async function syncFromCloud(silent = false) {
      if (!sbClient) { await initSupabase(); return; }
      const { data, error } = await sbClient
        .from('share_hub_items')
        .select('*')
        .order('created_at', { ascending: false });
      if (!error && Array.isArray(data)) {
        items = data;
        localStorage.setItem('sh_cache_items', JSON.stringify(items));
        setBadge(true, `Cloud (${items.length})`);
        render();
        if (!silent) showToast(`Synced (${items.length}) ✓`);
      }
    }

    function setBadge(ok, text) {
      document.getElementById('dbDot').className = ok ? 'w-1.5 h-1.5 rounded-full bg-emerald-500' : 'w-1.5 h-1.5 rounded-full bg-red-500';
      document.getElementById('dbText').textContent = text;
    }

    function switchTab(tab) {
      activeTab = tab;
      ['text', 'image', 'link'].forEach(t => {
        const active = t === tab;
        document.getElementById(`dt-${t}`).className = active
          ? 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-black text-white dark:bg-white dark:text-black'
          : 'px-3.5 py-1.5 rounded-lg text-xs font-semibold text-neutral-500';
        document.getElementById(`mb-${t}`).className = active
          ? 'py-2 rounded-xl text-xs font-semibold bg-black text-white dark:bg-white dark:text-black'
          : 'py-2 rounded-xl text-xs font-semibold text-neutral-500';
      });
      render();
    }

    function render() {
      ['text', 'image', 'link'].forEach(t => {
        const c = items.filter(i => i.type === t).length;
        document.getElementById(`dc-${t}`).textContent = c;
        document.getElementById(`mc-${t}`).textContent = c;
      });

      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const list = items.filter(i => i.type === activeTab && (!q || (i.title || '').toLowerCase().includes(q) || (i.content || '').toLowerCase().includes(q)));

      const grid = document.getElementById('gridContainer');
      const empty = document.getElementById('emptyBox');
      if (!list.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      grid.innerHTML = list.map(item => {
        const id = esc(item.id);
        const title = esc(item.title || 'Untitled');
        const content = esc(item.content || '');
        if (item.type === 'text') {
          return `
            <article class="clean-card rounded-2xl p-3 flex flex-col justify-between">
              <div onclick="openReader('${id}')" class="cursor-pointer">
                <h3 class="font-bold text-xs sm:text-sm line-clamp-1 mb-1">${title}</h3>
                <p class="text-[11px] sm:text-xs text-neutral-500 dark:text-neutral-400 line-clamp-3 break-words mb-3">${content}</p>
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-neutral-100 dark:border-neutral-800">
                <div class="flex gap-2 text-xs text-neutral-400">
                  <button onclick="openModal('${id}')" class="hover:text-black dark:hover:text-white">✎</button>
                  <button onclick="delItem('${id}')" class="hover:text-red-500">🗑</button>
                </div>
                <button onclick="copyItem('${id}')" class="px-2.5 py-1 rounded-lg bg-black text-white dark:bg-white dark:text-black text-[11px] font-semibold">Copy</button>
              </div>
            </article>`;
        }
        if (item.type === 'image') {
          return `
            <article class="clean-card rounded-2xl overflow-hidden flex flex-col justify-between">
              <img src="${content}" class="aspect-square w-full object-cover bg-neutral-100 dark:bg-neutral-900" />
              <div class="p-2.5 flex items-center justify-between">
                <span class="font-bold text-xs truncate">${title}</span>
                <button onclick="delItem('${id}')" class="text-xs text-neutral-400 hover:text-red-500">🗑</button>
              </div>
            </article>`;
        }
        return `
          <article class="clean-card rounded-2xl p-3 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-xs sm:text-sm line-clamp-1 mb-1">${title}</h3>
              <p class="text-[11px] text-neutral-400 truncate font-mono mb-3">${content}</p>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-neutral-100 dark:border-neutral-800">
              <button onclick="delItem('${id}')" class="text-xs text-neutral-400 hover:text-red-500">🗑</button>
              <a href="${content}" target="_blank" class="px-2.5 py-1 rounded-lg bg-black text-white dark:bg-white dark:text-black text-[11px] font-semibold">Open ↗</a>
            </div>
          </article>`;
      }).join('');
    }

    async function saveItem(e) {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const title = document.getElementById('inpTitle').value.trim() || 'Untitled';
      let content = '';
      if (formType === 'text') content = document.getElementById('inpText').value.trim();
      else if (formType === 'image') content = uploadedImg || document.getElementById('inpImgUrl').value.trim();
      else content = document.getElementById('inpLink').value.trim();
      if (!content) return;

      const record = {
        id: editId || ('t' + Date.now()),
        type: formType,
        title,
        content,
        created_at: Date.now()
      };

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      if (sbClient) {
        const { error } = await sbClient.from('share_hub_items').upsert([record]);
        if (error) {
          alert('Supabase Error: ' + error.message);
        } else {
          await syncFromCloud(true);
          showToast('Saved to Supabase ✓');
        }
      } else {
        items.unshift(record);
        localStorage.setItem('sh_cache_items', JSON.stringify(items));
        render();
        showToast('Saved Locally');
      }

      btn.disabled = false;
      btn.textContent = 'Save';
      closeModal();
      switchTab(formType);
    }

    async function delItem(id) {
      items = items.filter(i => String(i.id) !== String(id));
      localStorage.setItem('sh_cache_items', JSON.stringify(items));
      render();
      if (sbClient) {
        await sbClient.from('share_hub_items').delete().eq('id', id);
        await syncFromCloud(true);
      }
      showToast('Deleted');
    }

    function openModal(id = '') {
      document.getElementById('editId').value = id;
      uploadedImg = '';
      if (id) {
        const item = items.find(i => String(i.id) === String(id));
        if (!item) return;
        document.getElementById('inpTitle').value = item.title;
        setFormType(item.type);
        if (item.type === 'text') document.getElementById('inpText').value = item.content;
        if (item.type === 'image') document.getElementById('inpImgUrl').value = item.content;
        if (item.type === 'link') document.getElementById('inpLink').value = item.content;
      } else {
        document.getElementById('inpTitle').value = '';
        document.getElementById('inpText').value = '';
        document.getElementById('inpImgUrl').value = '';
        document.getElementById('inpLink').value = '';
        setFormType(activeTab);
      }
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }

    function setFormType(t) {
      formType = t;
      ['text', 'image', 'link'].forEach(x => {
        document.getElementById(`ft-${x}`).className = x === t ? 'py-1.5 rounded-lg bg-black text-white dark:bg-white dark:text-black' : 'py-1.5 rounded-lg text-neutral-500';
        document.getElementById(`fg-${x}`).classList.toggle('hidden', x !== t);
      });
    }

    function openReader(id) {
      const item = items.find(i => String(i.id) === String(id));
      if (!item) return;
      document.getElementById('rTitle').textContent = item.title;
      document.getElementById('rBody').textContent = item.content;
      document.getElementById('rCopy').onclick = () => { copyItem(id); closeReader(); };
      document.getElementById('rEdit').onclick = () => { closeReader(); openModal(id); };
      document.getElementById('rDel').onclick = () => { closeReader(); delItem(id); };
      document.getElementById('readerModal').classList.remove('hidden');
    }

    function closeReader() { document.getElementById('readerModal').classList.add('hidden'); }

    function openKeyModal() {
      document.getElementById('cfgUrl').value = localStorage.getItem('sh_custom_url') || SUPABASE_URL;
      document.getElementById('cfgKey').value = localStorage.getItem('sh_custom_key') || KEY_LIST[0];
      document.getElementById('keyModal').classList.remove('hidden');
    }

    async function saveCustomKey() {
      localStorage.setItem('sh_custom_url', document.getElementById('cfgUrl').value.trim());
      localStorage.setItem('sh_custom_key', document.getElementById('cfgKey').value.trim());
      document.getElementById('keyModal').classList.add('hidden');
      await initSupabase();
    }

    async function resetDefaultKey() {
      localStorage.removeItem('sh_custom_url');
      localStorage.removeItem('sh_custom_key');
      document.getElementById('keyModal').classList.add('hidden');
      await initSupabase();
    }

    function uploadImg(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => { uploadedImg = ev.target.result; };
      r.readAsDataURL(f);
    }

    function copyItem(id) {
      const item = items.find(i => String(i.id) === String(id));
      if (!item) return;
      navigator.clipboard.writeText(item.content);
      showToast('Copied!');
    }

    function toggleTheme() {
      const d = document.documentElement.classList.toggle('dark');
      localStorage.setItem('sh_theme', d ? 'dark' : 'light');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 1800);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
  </script>
</body>
</html>
